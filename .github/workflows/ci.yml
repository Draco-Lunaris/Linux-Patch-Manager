name: CI

# Releases-only: CI fires on version tags (+ manual dispatch).
# Local dev/test uses `just check` on the dev box; this workflow is the
# release-time gate + the official .deb + Docker image builder.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Quality Gates (release-time; local dev uses `just check`) ─────────────

  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just deps-deb
      - run: just clippy

  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just deps-deb
      - run: just test

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,just
      - run: just audit

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just frontend-lint

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just frontend-typecheck

  # ── Build & Release (tag push only) ────────────────────────────────────────

  # Guard: refuse to build a release whose tag name != Cargo.toml version.
  # Blocks a mislabeled tag (e.g. one pushed at a stale/wrong commit) from
  # producing a .deb or Docker image that embeds the wrong version.
  version-check:
    name: Version matches tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cargo.toml version matches tag
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag version:   $TAG_VER"
          echo "cargo version:  $CARGO_VER"
          if [ "$TAG_VER" != "$CARGO_VER" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match Cargo.toml version '$CARGO_VER'. Refusing to build a mislabeled release."
            exit 1
          fi

  build-and-release:
    name: Build & Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, audit, gitleaks, frontend-lint, frontend-typecheck, version-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload release assets
      id-token: write      # sign the provenance attestation
      attestations: write  # record it against this repo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: just deps-deb
      - run: just pkg-deb

      # The .deb installs as root and gains mTLS authority over the managed
      # fleet, so ship it with both an integrity checksum and a provenance
      # attestation. The checksum catches a corrupted download; the attestation
      # is what lets an operator prove the artifact came from this workflow.
      - name: Generate SHA256SUMS
        run: |
          sha256sum linux-patch-manager_*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: linux-patch-manager_*.deb

      # Detached GPG signature over SHA256SUMS. The attestation above already
      # proves the artifact came from this workflow; this signature is the
      # offline, GitHub-independent second path — it needs only gpg to check
      # and keeps verifying if this repo moves or the transparency log is
      # unreachable. Signing the checksum list rather than the .deb means one
      # signature covers every artifact listed in it.
      #
      # Skips with a warning when the key is not configured, so a missing
      # secret cannot block a release. See docs/release-signing.md.
      - name: Sign SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning title=Release not GPG-signed::RELEASE_GPG_PRIVATE_KEY is not configured, so SHA256SUMS.asc will not be published. SHA256SUMS and the build-provenance attestation are unaffected. See docs/release-signing.md."
            exit 0
          fi

          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT

          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "$KEY_ID" ]; then
            echo "::error title=Release signing failed::RELEASE_GPG_PRIVATE_KEY is set but no secret key could be imported."
            exit 1
          fi

          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${GPG_PASSPHRASE:-}" \
              --local-user "$KEY_ID" \
              --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS

          # Verify what we just produced rather than assuming it is good.
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS

          # Publish the matching public key so the release is self-contained.
          # It cannot drift from the signing key because it is derived from it.
          gpg --armor --export "$KEY_ID" > release-signing-key.asc

          echo "SHA256SUMS signed with ${KEY_ID}"
          echo "::notice title=Release signed::SHA256SUMS.asc signed with ${KEY_ID}"

      - name: Generate release notes
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.release_notes.outputs.notes }}
          # SHA256SUMS.asc is absent until the signing key is configured;
          # an unmatched entry must not fail the release.
          fail_on_unmatched_files: false
          files: |
            linux-patch-manager_*.deb
            SHA256SUMS
            SHA256SUMS.asc
            release-signing-key.asc

  docker:
    name: Docker Build & Push
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, audit, gitleaks, frontend-lint, frontend-typecheck, version-check]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/draco-lunaris/linux-patch-manager
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max