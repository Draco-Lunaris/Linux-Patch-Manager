name: CI Pipeline

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-format:
    name: Rust Format Check
    runs-on: linux
    steps:
      - name: Install checkout dependencies
        run: |
          SUDO=""; [ "$(/usr/bin/id -u)" -ne 0 ] && SUDO="/usr/bin/sudo"
          $SUDO /usr/bin/apt-get update -qq
          $SUDO /usr/bin/apt-get install -y --no-install-recommends /usr/bin/curl ca-certificates

      - name: Checkout repository
        run: |
          TOKEN="${GITHUB_TOKEN:-$GITEA_TOKEN}"
          /usr/bin/curl -sf -H "Authorization: token ${TOKEN}" \
            "http://192.168.2.189:3000/api/v1/repos/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" \
            -o repo.tar.gz
          /bin/tar xzf repo.tar.gz --strip-components=1
          /bin/rm repo.tar.gz

      - name: Ensure Rust toolchain
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          if ! /usr/bin/which cargo &>/dev/null; then
            /usr/bin/curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | /bin/sh -s -- -y
            . "$HOME/.cargo/env"
          fi
          rustup component add rustfmt
          echo "Rust: $(cargo --version)"
          echo "Rustfmt: $(rustfmt --version)"

      - name: Check formatting
        run: |
          . "$HOME/.cargo/env"
          cargo fmt --check --all 2>&1

  clippy:
    name: Clippy Lints
    runs-on: linux
    steps:
      - name: Install checkout dependencies
        run: |
          SUDO=""; [ "$(/usr/bin/id -u)" -ne 0 ] && SUDO="/usr/bin/sudo"
          $SUDO /usr/bin/apt-get update -qq
          $SUDO /usr/bin/apt-get install -y --no-install-recommends /usr/bin/curl ca-certificates

      - name: Install system dependencies
        run: |
          SUDO=""; [ "$(/usr/bin/id -u)" -ne 0 ] && SUDO="/usr/bin/sudo"
          $SUDO /usr/bin/apt-get update -qq
          $SUDO /usr/bin/apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Checkout repository
        run: |
          TOKEN="${GITHUB_TOKEN:-$GITEA_TOKEN}"
          /usr/bin/curl -sf -H "Authorization: token ${TOKEN}" \
            "http://192.168.2.189:3000/api/v1/repos/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" \
            -o repo.tar.gz
          /bin/tar xzf repo.tar.gz --strip-components=1
          /bin/rm repo.tar.gz

      - name: Ensure Rust toolchain
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          if ! /usr/bin/which cargo &>/dev/null; then
            /usr/bin/curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | /bin/sh -s -- -y
            . "$HOME/.cargo/env"
          fi
          rustup component add clippy
          echo "Rust: $(cargo --version)"

      - name: Run Clippy
        run: |
          . "$HOME/.cargo/env"
          cargo clippy --all-targets --all-features 2>&1

  rust-test:
    name: Rust Unit Tests
    runs-on: linux
    steps:
      - name: Install checkout dependencies
        run: |
          SUDO=""; [ "$(/usr/bin/id -u)" -ne 0 ] && SUDO="/usr/bin/sudo"
          $SUDO /usr/bin/apt-get update -qq
          $SUDO /usr/bin/apt-get install -y --no-install-recommends /usr/bin/curl ca-certificates

      - name: Install system dependencies
        run: |
          SUDO=""; [ "$(/usr/bin/id -u)" -ne 0 ] && SUDO="/usr/bin/sudo"
          $SUDO /usr/bin/apt-get update -qq
          $SUDO /usr/bin/apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Checkout repository
        run: |
          TOKEN="${GITHUB_TOKEN:-$GITEA_TOKEN}"
          /usr/bin/curl -sf -H "Authorization: token ${TOKEN}" \
            "http://192.168.2.189:3000/api/v1/repos/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" \
            -o repo.tar.gz
          /bin/tar xzf repo.tar.gz --strip-components=1
          /bin/rm repo.tar.gz

      - name: Ensure Rust toolchain
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          if ! /usr/bin/which cargo &>/dev/null; then
            /usr/bin/curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | /bin/sh -s -- -y
            . "$HOME/.cargo/env"
          fi
          echo "Rust: $(cargo --version)"

      - name: Run tests
        run: |
          . "$HOME/.cargo/env"
          cargo test --workspace --all-features 2>&1

  security-audit:
    name: Security Audit
    runs-on: linux
    steps:
      - name: Install checkout dependencies
        run: |
          SUDO=""; [ "$(/usr/bin/id -u)" -ne 0 ] && SUDO="/usr/bin/sudo"
          $SUDO /usr/bin/apt-get update -qq
          $SUDO /usr/bin/apt-get install -y --no-install-recommends /usr/bin/curl ca-certificates

      - name: Checkout repository
        run: |
          TOKEN="${GITHUB_TOKEN:-$GITEA_TOKEN}"
          /usr/bin/curl -sf -H "Authorization: token ${TOKEN}" \
            "http://192.168.2.189:3000/api/v1/repos/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" \
            -o repo.tar.gz
          /bin/tar xzf repo.tar.gz --strip-components=1
          /bin/rm repo.tar.gz

      - name: Ensure Rust toolchain
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          if ! /usr/bin/which cargo &>/dev/null; then
            /usr/bin/curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | /bin/sh -s -- -y
            . "$HOME/.cargo/env"
          fi
          echo "Rust: $(cargo --version)"

      - name: Install cargo-audit
        run: |
          . "$HOME/.cargo/env"
          cargo install cargo-audit 2>&1

      - name: Run security audit
        run: |
          . "$HOME/.cargo/env"
          cargo audit 2>&1

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: linux
    steps:
      - name: Install checkout dependencies
        run: |
          SUDO=""; [ "$(/usr/bin/id -u)" -ne 0 ] && SUDO="/usr/bin/sudo"
          $SUDO /usr/bin/apt-get update -qq
          $SUDO /usr/bin/apt-get install -y --no-install-recommends /usr/bin/curl ca-certificates

      - name: Checkout repository
        run: |
          TOKEN="${GITHUB_TOKEN:-$GITEA_TOKEN}"
          /usr/bin/curl -sf -H "Authorization: token ${TOKEN}" \
            "http://192.168.2.189:3000/api/v1/repos/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" \
            -o repo.tar.gz
          /bin/tar xzf repo.tar.gz --strip-components=1
          /bin/rm repo.tar.gz

      - name: Install Node.js dependencies
        working-directory: frontend
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          npm ci

      - name: Run ESLint
        working-directory: frontend
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          npx eslint src/ --ext .ts,.tsx --max-warnings 0 2>&1

      - name: TypeScript type check
        working-directory: frontend
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          npx tsc --noEmit 2>&1

  build-and-release:
    name: Build .deb & Release
    runs-on: linux
    needs: [rust-format, clippy, rust-test, security-audit, frontend-lint]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Install system dependencies
        run: |
          SUDO=""; [ "$(/usr/bin/id -u)" -ne 0 ] && SUDO="/usr/bin/sudo"
          $SUDO /usr/bin/apt-get update -qq
          $SUDO /usr/bin/apt-get install -y --no-install-recommends \
            /usr/bin/curl pkg-config libssl-dev ca-certificates \
            git nodejs npm dpkg-dev python3

      - name: Checkout repository
        run: |
          TOKEN="${GITHUB_TOKEN:-$GITEA_TOKEN}"
          /usr/bin/curl -sf -H "Authorization: token ${TOKEN}" \
            "http://192.168.2.189:3000/api/v1/repos/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" \
            -o repo.tar.gz
          /bin/tar xzf repo.tar.gz --strip-components=1
          /bin/rm repo.tar.gz

      - name: Ensure Rust toolchain
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          if ! /usr/bin/which cargo &>/dev/null; then
            /usr/bin/curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | /bin/sh -s -- -y
            . "$HOME/.cargo/env"
          fi
          echo "Rust: $(cargo --version)"

      - name: Build Rust backend (release)
        run: |
          . "$HOME/.cargo/env"
          cargo build --release 2>&1

      - name: Run Rust tests
        run: |
          . "$HOME/.cargo/env"
          cargo test --workspace --all-features 2>&1

      - name: Strip binaries
        run: |
          /usr/bin/strip target/release/pm-web target/release/pm-worker

      - name: Build frontend
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          cd frontend && npm ci && npm run build

      - name: Determine version
        run: |
          VERSION=$(/usr/bin/grep '^version' Cargo.toml | /usr/bin/head -1 | /bin/sed 's/.*=.*"\(.*\)"/\1/')
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building version: ${VERSION}"

      - name: Assemble .deb package
        run: |
          /bin/chmod +x scripts/build-package.sh
          scripts/build-package.sh

      - name: Verify package
        run: |
          /usr/bin/ls -la target/package/*.deb
          /usr/bin/dpkg-deb -I target/package/linux-patch-manager_*.deb

      - name: Create Gitea Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          . "$HOME/.cargo/env"
          VERSION=$(/usr/bin/grep '^version' Cargo.toml | /usr/bin/head -1 | /bin/sed 's/.*=.*"\(.*\)"/\1/')
          REPO="${GITHUB_REPOSITORY:-echo/linux_patch_manager}"
          REF_NAME="${GITHUB_REF_NAME:-v${VERSION}}"
          DEB=$(/usr/bin/ls target/package/linux-patch-manager_*.deb)
          /usr/bin/python3 scripts/create-release.py \
            --repo "${REPO}" \
            --tag "${REF_NAME}" \
            --title "Release ${REF_NAME}" \
            --asset "${DEB}" \
            --token "${GITHUB_TOKEN:-$GITEA_TOKEN}" \
            --gitea-url "http://192.168.2.189:3000"
